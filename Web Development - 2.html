<!DOCTYPE html>
<html>
<head> 
<title> Web development - 2 </title>
</head>
<body>
<p> I am normal </p>
<p Style = "color:red;"> I am red </p>
<p Style = "color:green;"> I am green </p>
<p Style = "font-size:50px;"> I am big </p>
<p>My Name is Akhit </p>
<p><b> My name is Akshit </b></p>
<p><u> My name is Akshit </u></p>
<p><i> My name is Akshit </i></p>
<p><strong> My name is Akshit </strong></p>
<p><strong><u><i> My name is Akshit </strong></u></i></p>
<p><small> My name is Akshit </small></p>
<p> My name is <mark> Akshit </mark> </p>
<p><del> My name is Akshit </del></p>
<p> My name is <ins>Akshit</ins></p>
<p> My name is Akshit<sup>2</sup> </p>
<p> My name is Akshit<sub>2</sub> </p>
</body>
